services:
  rtmp:
    build: ./rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"
    environment:
      TZ: UTC  # file names are stamped in UTC; the bot converts to each DJ's timezone
    volumes:
      - recordings:/recordings
    depends_on:
      - bot

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - recordings:/recordings
      - ./config:/config

  web:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bot

volumes:
  recordings:
  caddy_data:
