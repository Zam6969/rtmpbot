user www-data;
worker_processes 1;
include /etc/nginx/modules-enabled/*.conf;
error_log /dev/stderr info;

events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;

            # Nobody may watch through this server; it only ingests and records.
            deny play all;

            # Files are named <streamkey>-<date>-<time>.flv; the bot maps the key to the DJ.
            record all;
            record_path /recordings;
            record_suffix -%Y%m%d-%H%M%S.flv;

            # The bot accepts or rejects each stream key and gets told when a recording is done.
            on_publish      http://bot:8080/rtmp/publish;
            on_publish_done http://bot:8080/rtmp/publish_done;
            on_record_done  http://bot:8080/rtmp/record_done;
        }
    }
}
